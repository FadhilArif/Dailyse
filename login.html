<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - Runut</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">Runut<span>.</span></div>
    <p class="auth-tag">Rencanakan harimu, lacak progresmu.</p>

    <div class="auth-toggle">
      <button id="tab-login" class="active" onclick="switchTab('login')">Masuk</button>
      <button id="tab-register" onclick="switchTab('register')">Daftar</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <form id="form-login" onsubmit="doLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Kata Sandi</label>
        <input type="password" id="login-password" required autocomplete="current-password" minlength="6">
      </div>
      <button class="btn" style="width:100%" type="submit" id="login-btn">Masuk</button>
    </form>

    <form id="form-register" style="display:none" onsubmit="doRegister(event)">
      <div class="field">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" required autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Kata Sandi (min. 6 karakter)</label>
        <input type="password" id="reg-password" required autocomplete="new-password" minlength="6">
      </div>
      <button class="btn" style="width:100%" type="submit" id="reg-btn">Buat Akun</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  hideError();
}
function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('auth-error').classList.remove('show');
}

async function doLogin(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Masuk';
  if (error) { showError('Email atau kata sandi salah.'); return; }
  window.location.href = 'dashboard.html';
}

async function doRegister(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  const { data, error } = await supabaseClient.auth.signUp({
    email, password, options: { data: { full_name: name } }
  });
  if (error) { btn.disabled = false; btn.textContent = 'Buat Akun'; showError(error.message); return; }

  // Simpan nama ke tabel profiles (kalau sesi langsung aktif)
  if (data.user) {
    await supabaseClient.from('profiles').upsert({ id: data.user.id, full_name: name });
  }

  btn.disabled = false; btn.textContent = 'Buat Akun';

  if (data.session) {
    window.location.href = 'dashboard.html';
  } else {
    showError('Akun dibuat. Cek email kamu untuk konfirmasi, lalu masuk.');
    switchTab('login');
  }
}

// Kalau sudah login, langsung ke dashboard
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = 'dashboard.html';
})();
</script>
</body>
</html>
