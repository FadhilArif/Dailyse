<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - Runut</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <div id="nav-root"></div>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="app-title">Dashboard</div>
        <div class="greeting" id="greeting-text">Halo</div>
      </div>
      <div id="today-label" style="color:var(--muted); font-size:13.5px;"></div>
    </div>

    <div class="grid grid-3">
      <div class="card stat">
        <span class="label">Progres Hari Ini</span>
        <span class="value" id="stat-progress">-</span>
        <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" id="stat-progress-bar" style="width:0%"></div></div>
      </div>
      <div class="card stat">
        <span class="label">Lamaran Aktif</span>
        <span class="value" id="stat-jobs">-</span>
        <span class="label" id="stat-jobs-sub">menunggu / diproses</span>
      </div>
      <div class="card stat">
        <span class="label">Total Lamaran</span>
        <span class="value" id="stat-jobs-total">-</span>
        <span class="label">sepanjang waktu</span>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h3 style="margin-bottom:10px;">Rencana Hari Ini</h3>
      <div id="today-list"></div>
    </div>

    <div class="card" style="margin-top:0;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
        <h3>Rata-Rata Penggunaan Aplikasi</h3>
        <select id="usage-period" style="width:auto;" onchange="loadUsage()">
          <option value="1">Hari ini</option>
          <option value="3">3 hari terakhir</option>
          <option value="7" selected>7 hari terakhir</option>
        </select>
      </div>
      <div id="usage-list"></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
let CURRENT_USER = null;

(async () => {
  CURRENT_USER = await requireAuth();
  if (!CURRENT_USER) return;

  const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', CURRENT_USER.id).single();
  renderNav('dashboard', profile?.full_name || CURRENT_USER.email);

  document.getElementById('today-label').textContent = formatTanggalIndo(todayStr());

  loadToday();
  loadJobs();
  loadUsage();
})();

async function loadToday() {
  const { data: rows } = await supabaseClient
    .from('daily_activity_log')
    .select('*')
    .eq('tanggal', todayStr())
    .order('urutan', { ascending: true });

  const list = document.getElementById('today-list');

  if (!rows || rows.length === 0) {
    list.innerHTML = `<div class="empty">Belum ada rencana untuk hari ini.
      <div><a class="btn secondary" href="daily-activity.html">Buat dari template</a></div></div>`;
    document.getElementById('stat-progress').textContent = '-';
    return;
  }

  const done = rows.filter(r => r.ceklis).length;
  const pct = Math.round((done / rows.length) * 100);
  document.getElementById('stat-progress').textContent = pct + '%';
  document.getElementById('stat-progress-bar').style.width = pct + '%';

  list.innerHTML = rows.slice(0, 6).map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
      <div>
        <div style="font-weight:600; font-size:13.5px;">${r.kegiatan}</div>
        <div style="color:var(--muted); font-size:12px;">${r.jam_mulai || ''} ${r.jam_selesai ? '- ' + r.jam_selesai : ''}</div>
      </div>
      <span class="badge ${r.ceklis ? 'ceklis' : 'belum'}">${r.ceklis ? 'Selesai' : 'Belum'}</span>
    </div>`).join('') + `<div style="margin-top:10px;"><a href="daily-activity.html">Lihat & isi selengkapnya →</a></div>`;
}

async function loadJobs() {
  const { data: rows } = await supabaseClient.from('job_applications').select('status');
  const total = rows ? rows.length : 0;
  const aktif = rows ? rows.filter(r => r.status === 'Menunggu' || r.status === 'Diproses' || r.status === 'Interview').length : 0;
  document.getElementById('stat-jobs').textContent = aktif;
  document.getElementById('stat-jobs-total').textContent = total;
}

async function loadUsage() {
  const days = parseInt(document.getElementById('usage-period').value, 10);
  const since = addDays(todayStr(), -(days - 1));

  const { data: rows } = await supabaseClient
    .from('app_usage_tracking')
    .select('nama_app, durasi_menit, tanggal')
    .gte('tanggal', since)
    .lte('tanggal', todayStr());

  const box = document.getElementById('usage-list');
  if (!rows || rows.length === 0) {
    box.innerHTML = `<div class="empty">Belum ada data penggunaan aplikasi pada periode ini.
      <div><a class="btn secondary" href="app-usage.html">Setor penggunaan aplikasi</a></div></div>`;
    return;
  }

  const byApp = {};
  rows.forEach(r => {
    if (!byApp[r.nama_app]) byApp[r.nama_app] = { total: 0, hari: new Set() };
    byApp[r.nama_app].total += r.durasi_menit;
    byApp[r.nama_app].hari.add(r.tanggal);
  });

  const list = Object.entries(byApp)
    .map(([app, v]) => ({ app, avg: v.total / days, total: v.total }))
    .sort((a, b) => b.avg - a.avg);

  const maxAvg = Math.max(...list.map(x => x.avg), 1);

  box.innerHTML = list.map(x => `
    <div style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px;">
        <span style="font-weight:600;">${x.app}</span>
        <span style="color:var(--muted);">rata-rata ${Math.round(x.avg)} menit/hari</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${(x.avg / maxAvg) * 100}%; background:var(--accent);"></div></div>
    </div>`).join('');
}
</script>
</body>
</html>
